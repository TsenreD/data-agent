llm:
  provider: local
  model: /home/jovyan/shares/SR008.fs2/models/MiniMax-M2.5/
  base_url: http://localhost:8000/v1/chat/completions
  api_key: empty
  github_token: 

agents:
  collection:
    max_steps: 30
    max_attempts: 1
    retry_on_empty: true
    execution_timeout_seconds: 50
  eda:
    max_steps: 6
    max_attempts: 4
    inspection_max_attempts: 2
  quality:
    imbalance_threshold: 0.8
    strategy:
      missing: median
      duplicates: drop
      outliers: clip_iqr
  annotation:
    base_url: http://localhost:8000/v1/chat/completions
    prompt: |
      Determine whether given problem contains enough information to be solvable.
      If a problem is not missing crucial information, asnwer \boxed{1}
      Otherwise answer \boxed{0}
    process_config:
      parallel_workers: 150
      timeout_per_row: 600
      max_retries: 2
      max_tokens: 8192
  active_learning:
    task_prompt: |
      Train classification model to determine whether text contains a full problem, or an incomplete one.
      When annotation label is 1, problem is considered complete, with label 0 marking incomplete problems.
      Use DeepPavlov/rubert-base-cased, train ONLY a classification head on top.
      Make sure to choose model size accordingly to the amount of available data.
      Train for 5 epochs, bs=20.
    feature_columns:
      - text
    strategy: entropy
    batch_size: 20
    max_steps: 30
    test_size: 0.25
    execution_timeout_seconds: 180


sources:
  - type: hf_dataset
    name: madrylab/gsm8k-platinum
    split: test
    limit: 50
    column_map:
      text: question
      label: answer

  - type: scrape 
    name: project-euler
    url: https://projecteuler.net/archives
    limit: 10
    allow_network: true

  - type: scrape 
    name: all-russian
    url: https://vos.olimpiada.ru/2025/invite/tasks
    limit: 60
    allow_network: true
    extraction_instructions: |
      Extract one record per actual olympiad problem, not one record per year page.
      Follow child links when needed.
      Put the full problem statement in `text`.
      Preserve year, round, source_url, and solution_url when available.
      Retain only mathematical and physical problems.
