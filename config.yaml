project:
  name: text-sentiment-collection
  modality: text

# llm:
#   provider: ollama
#   model: gpt-oss:120b-cloud
#   base_url: http://localhost:11434/v1/chat/completions
#   github_token: 

llm:
  provider: openrouter
  model: openrouter/hunter-alpha
  base_url: https://openrouter.ai/api/v1/chat/completions
  api_key: 
  github_token: 

agents:
  collection:
    max_steps: 25
    max_attempts: 1
    retry_on_empty: true
  eda:
    max_steps: 5
    max_attempts: 2
    inspection_max_attempts: 1


sources:
  - type: hf_dataset
    name: MathArena/aime_2026
    split: train
    limit: 200
    column_map:
      text: problem
      label: answer

  # - type: scrape 
  #   name: usamo_all
  #   url: https://www.mathschool.com/blog/competitions/usamo-problems-and-solutions
  #   limit: 200
  #   allow_network: true
  #   extraction_instructions: |
  #     Extract one record per actual olympiad problem, not one record per year page.
  #     Follow child links when needed.
  #     Put the full problem statement in `text`.
  #     Preserve year, round, source_url, and solution_url when available.

  # - type: scrape 
  #   name: project-euler
  #   url: https://projecteuler.net/archives
  #   limit: 200
  #   allow_network: true

  - type: scrape # works semi-well with hunter
    name: all-russian
    url: https://vos.olimpiada.ru/2025/invite/tasks
    limit: 200
    allow_network: true
    extraction_instructions: |
      Extract one record per actual olympiad problem, not one record per year page.
      Follow child links when needed.
      Put the full problem statement in `text`.
      Preserve year, round, source_url, and solution_url when available.
  
