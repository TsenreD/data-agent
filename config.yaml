llm:
  provider: local
  model: MiniMax-M2.5
  base_url: http://localhost:8000/v1/chat/completions
  api_key: empty
  github_token: 

agents:
  collection:
    max_steps: 25
    max_attempts: 1
    retry_on_empty: true
  eda:
    max_steps: 5
    max_attempts: 2
    inspection_max_attempts: 1
  quality:
    imbalance_threshold: 0.8
    strategy:
      missing: median
      duplicates: drop
      outliers: clip_iqr
  annotation:
    confidence_threshold: 0.75
    task: answer_annotation
    base_url: http://localhost:8000/v1/chat/completions
    prompt: |
      For rows with no label, try to solve the text problem.
      If a problem is incomplete (and has no solution), keep label empty,
      set new field "has_complete_problem" to false, otherwise to true.
    process_config:
      parallel_workers: 200
      timeout_per_row: 120
      max_retries: 3
      max_tokens: 8192


sources:
  - type: hf_dataset
    name: MathArena/aime_2026
    split: train
    limit: 50
    column_map:
      text: problem
      label: answer

  - type: scrape 
    name: project-euler
    url: https://projecteuler.net/archives
    limit: 50
    allow_network: true

  - type: scrape 
    name: all-russian
    url: https://vos.olimpiada.ru/2025/invite/tasks
    limit: 50
    allow_network: true
    extraction_instructions: |
      Extract one record per actual olympiad problem, not one record per year page.
      Follow child links when needed.
      Put the full problem statement in `text`.
      Preserve year, round, source_url, and solution_url when available.
      Retain only mathematical and physical problems!.
