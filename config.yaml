llm:
  provider: local
  model: /home/jovyan/shares/SR008.fs2/models/MiniMax-M2.5/
  base_url: http://localhost:8000/v1/chat/completions
  api_key: empty
  github_token: 

  # Docker sandbox resource limits for CodeAgent
  sandbox:
    memory_limit: "4g"
    cpu_limit: 2
    shm_size: "4g"
    pids_limit: 200

  eda_sandbox:
    memory_limit: "4g"
    cpu_limit: 2
    shm_size: "4g"
    pids_limit: 200

agents:
  collection:
    max_steps: 25
    max_attempts: 1
    retry_on_empty: true
    execution_timeout_seconds: 40
  eda:
    max_steps: 6
    max_attempts: 4
    inspection_max_attempts: 2
  quality:
    imbalance_threshold: 0.8
    strategy:
      missing: median
      duplicates: drop
      outliers: clip_iqr
  annotation:
    base_url: http://localhost:8000/v1/chat/completions
    prompt: |
      Solve the text problem, put your answer in \boxed{}.
      If a problem is incomplete (and has no solution), set label to "invalid".
    process_config:
      parallel_workers: 30
      timeout_per_row: 120
      max_retries: 2
      max_tokens: 8192
  active_learning:
    task_prompt: |
      Train classification model to determine whether text contains a full problem, or an incomplete one.
      Use fasttext as base model, train a classification head on top.
    target_column: label
    feature_columns:
      - text
    strategy: entropy
    batch_size: 20
    test_size: 0.25
    model:
      dim: 64
      bucket_size: 8192
      min_n: 3
      max_n: 6
      learning_rate: 0.05
      epochs: 25


sources:
  - type: hf_dataset
    name: madrylab/gsm8k-platinum
    split: test
    limit: 50
    column_map:
      text: question
      label: answer

  - type: scrape 
    name: project-euler
    url: https://projecteuler.net/archives
    limit: 10
    allow_network: true

  - type: scrape 
    name: all-russian
    url: https://vos.olimpiada.ru/2025/invite/tasks
    limit: 40
    allow_network: true
    extraction_instructions: |
      Extract one record per actual olympiad problem, not one record per year page.
      Follow child links when needed.
      Put the full problem statement in `text`.
      Preserve year, round, source_url, and solution_url when available.
      Retain only mathematical and physical problems.
