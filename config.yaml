project:
  name: text-sentiment-collection
  modality: text

llm:
  provider: ollama
  model: kimi-k2.5:cloud
  base_url: http://localhost:11434/v1/chat/completions

sources:
  - type: hf_dataset
    name: MathArena/aime_2026
    split: train
    limit: 200
    column_map:
      text: problem
      label: answer

  - type: scrape
    name: aops-all-russian-olympiad
    url: https://artofproblemsolving.com/community/c4299349_2025_allrussian_olympiad
    limit: 200
    allow_network: true
    max_attempts: 3
    retry_on_empty: true
