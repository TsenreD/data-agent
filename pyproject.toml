[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "Sequential data collection agent scaffold with optional Ollama-backed extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "black>=24.0",
  "click>=8.1",
  "colorama>=0.4",
  "beautifulsoup4>=4.12",
  "datasets>=2.20",
  "ddgs>=9.0",
  "fake-useragent>=1.5",
  "fasttext>=0.9.3",
  "fastapi>=0.115",
  "html5lib>=1.1",
  "httpx>=0.28",
  "ipykernel>=6.29",
  "ipython>=8.0",
  "jupyter>=1.1",
  "jupyter_client>=8.6",
  "jupyter_kernel_gateway>=2.5",
  "loguru>=0.7",
  "lxml>=5.3",
  "markdownify>=0.13",
  "matplotlib>=3.8",
  "mypy>=1.8",
  "numpy>=1.26",
  "openai>=2.28",
  "openpyxl>=3.1",
  "orjson>=3.10",
  "pandas>=2.2",
  "parsel>=1.9",
  "pdfminer.six>=20231228",
  "pdfplumber>=0.11",
  "pillow>=10.0",
  "playwright>=1.48",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "pymupdf>=1.24",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "pytz>=2024.1",
  "pyyaml>=6.0",
  "rapidfuzz>=3.10",
  "readability-lxml>=0.8",
  "regex>=2024.5.15",
  "requests>=2.32",
  "rich>=13.8",
  "ruff>=0.5",
  "scrapy>=2.11",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
  "selenium>=4.25",
  "selenium-stealth>=1.0",
  "selectolax>=0.3",
  "smolagents>=1.24.0",
  "tenacity>=9.0",
  "torch>=2.4",
  "transformers>=4.46",
  "trafilatura>=1.12",
  "typer>=0.12",
  "uvicorn>=0.30",
  "label-studio-sdk>=1.0,<2",
  "websocket-client>=1.9",
  "xlsxwriter>=3.2"
]

[project.scripts]
data-agent = "cli:main"
data-agent-collect = "cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ipython>=8.0",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["annotation_agent", "cli"]

[tool.setuptools.packages.find]
include = ["agents*", "models*"]

[tool.setuptools.package-data]
"agents.data_collection" = ["skills/*/SKILL.md"]
"agents.data_annotation" = ["spec.md", "skills/*/SKILL.md"]
"agents.active_learning" = ["spec.md"]
"agents.data_quality" = ["skills/*/SKILL.md"]
