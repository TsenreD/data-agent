[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "Sequential data collection agent scaffold with optional Ollama-backed extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "datasets>=2.20",
  "ddgs>=9.0",
  "docker>=7.1",
  "httpx>=0.28",
  "jupyter>=1.1",
  "matplotlib>=3.8",
  "openai>=2.28",
  "pandas>=2.2",
  "pdfminer.six>=20231228",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "pymupdf>=1.24",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scrapy>=2.11",
  "seaborn>=0.13",
  "smolagents>=1.24.0",
  "websocket-client>=1.9",
  "label-studio>=1.23",
]

[project.scripts]
data-agent = "cli:main"
data-agent-collect = "cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ipython>=8.0",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["annotation_agent", "cli"]

[tool.setuptools.packages.find]
include = ["agents*", "models*"]

[tool.setuptools.package-data]
"agents.data_collection" = ["Dockerfile.parse", "Dockerfile.eda", "skills/*/SKILL.md"]
"agents.data_annotation" = ["spec.md", "skills/*/SKILL.md"]
"agents.active_learning" = ["spec.md"]
"agents.data_quality" = ["skills/*/SKILL.md"]
