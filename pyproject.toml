[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "Sequential data collection agent scaffold with optional Ollama-backed extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "datasets>=2.20",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[project.scripts]
data-agent = "cli:main"
data-agent-collect = "cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ipython>=8.0",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["agents*", "analysis*", "executor*", "models*"]

[tool.setuptools.package-data]
"agents.data_collection" = ["SKILLS.md"]
