[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "Sequential data collection agent scaffold with optional Ollama-backed extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "datasets>=2.20",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[tool.setuptools]
py-modules = ["data_collection_agent", "pipeline"]

[tool.setuptools.packages.find]
include = ["agents*", "analysis*", "executor*", "models*"]
